{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activate Profile - LogiControl India</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .card-check {
            background: linear-gradient(135deg, #0b4a99 0%, #1e3a8a 100%);
            color: white;
            border-radius: 1rem;
            padding: 2.5rem;
            position: relative;
            text-align: center;
            margin-bottom: -3rem;
            z-index: 1;
        }

        .card-check .icon-box {
            background: rgba(255,255,255,0.1);
            width: 64px;
            height: 64px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 1.5rem auto;
        }

        .form-wrapper {
            background: white;
            border-radius: 1rem;
            padding: 4rem 2.5rem 2.5rem 2.5rem;
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            position: relative;
            z-index: 2;
        }
        
        /* Override crispy forms slightly for sleeker look */
        .form-wrapper .form-control {
            padding: 0.75rem 1rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background-color: #f8fafc;
        }
        
        .form-wrapper .form-control:focus {
            background-color: #ffffff;
            border-color: #0b4a99;
            box-shadow: 0 0 0 0.25rem rgba(11, 74, 153, 0.1);
        }

        .btn-primary-custom {
            background-color: #0b4a99;
            border: none;
            color: white;
            padding: 0.8rem;
            transition: background-color 0.2s;
        }

        .btn-primary-custom:hover {
            background-color: #093b7a;
            color: white;
        }
        
        .brand-logo {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-weight: 800;
            font-size: 1.5rem;
            color: #0b4a99;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
    </style>
</head>
<body>

    <a href="#" class="brand-logo">
        <i class="bi bi-truck-front-fill"></i> LogiControl
    </a>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <!-- Header Banner -->
                <div class="card-check shadow-sm">
                    <div class="icon-box">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h4 class="fw-bold mb-2">Mandatory Security Update</h4>
                    <p class="small text-white-50 mb-0">Please set your permanent password to activate your LogiControl profile.</p>
                </div>

                <!-- Form Container -->
                <div class="form-wrapper mt-4">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}
                        
                        <div class="d-grid mt-4 pt-2">
                            <button type="submit" class="btn btn-primary-custom btn-lg fw-bold rounded-3 shadow-sm">
                                Activate My Account <i class="bi bi-check-circle-fill ms-2"></i>
                            </button>
                        </div>
                    </form>
                </div>
                
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
