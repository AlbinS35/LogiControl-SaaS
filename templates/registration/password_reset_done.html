{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LogiControl – Recovery Link Sent</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(160deg,#eef2ff,#f0f4ff);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem}
.logo-wrap{display:flex;align-items:center;gap:.7rem;margin-bottom:2rem}
.logo-icon{width:42px;height:42px;background:#2563eb;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.2rem}
.logo-text{font-size:1.3rem;font-weight:800;color:#0f172a}
.logo-text span{color:#2563eb}
.card{background:#fff;border-radius:18px;padding:2.5rem;max-width:440px;width:100%;box-shadow:0 4px 40px rgba(37,99,235,.08);border:1.5px solid #e2e8f0;text-align:center}
.success-icon{width:64px;height:64px;background:#f0fdf4;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 1.2rem;font-size:1.8rem;color:#16a34a}
h2{font-size:1.5rem;font-weight:800;color:#0f172a;margin-bottom:.5rem}
p{font-size:.88rem;color:#64748b;line-height:1.6;margin-bottom:1.5rem}
.btn{display:inline-block;background:#1338be;color:#fff;padding:.75rem 2rem;border-radius:10px;font-weight:700;font-size:.9rem;transition:all .2s}
.btn:hover{background:#0f2fa0;color:#fff}
</style>
</head>
<body>
<div class="logo-wrap">
  <div class="logo-icon"><i class="bi bi-truck-front-fill"></i></div>
  <div class="logo-text">Logi<span>Control</span></div>
</div>
<div class="card">
  <div class="success-icon"><i class="bi bi-envelope-check-fill"></i></div>
  <h2>Recovery Link Sent</h2>
  <p>Check your inbox. We've sent a secure password reset link to your registered work email. The link expires in 30 minutes.</p>
  <a href="{% url 'login' %}" class="btn">← Back to Login</a>
</div>
</body>
</html>
