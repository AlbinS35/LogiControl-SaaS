<!-- Leaflet JS (free, no API key needed) -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

{% if active_trip %}
<script id="map-data-json" type="application/json">
{
    "lat":     {{ map_data.lat|default:"20.5937" }},
    "lng":     {{ map_data.lng|default:"78.9629" }},
    "reg":     "{{ map_data.reg|escapejs }}",
    "start":   "{{ map_data.start|escapejs }}",
    "end":     "{{ map_data.end|escapejs }}",
    "speed":   {{ map_data.speed|default:"0" }},
    "heading": "{{ map_data.heading|escapejs }}",
    "pct":     {% if map_data.total_km and map_data.total_km > 0 %}{% widthratio map_data.traveled_km map_data.total_km 100 %}{% else %}0{% endif %},
    "has_gps": {% if map_data.lat and map_data.lat != 20.5937 %}true{% else %}false{% endif %}
}
</script>
<script>
const MD = JSON.parse(document.getElementById('map-data-json').textContent);
let map, routeCoords = [], poiLayerGroup = null, vehicleMarker = null;
let activePoiType = null;

/* ── Icons ────────────────────────────────────────────────────────────── */
function makeCircleIcon(emoji, bg) {
    return L.divIcon({
        className: '',
        html: `<div style="background:${bg};color:white;border-radius:50%;width:34px;height:34px;
                     display:flex;align-items:center;justify-content:center;
                     font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,0.3);border:2px solid white;">${emoji}</div>`,
        iconSize: [34, 34], iconAnchor: [17, 17],
    });
}
function makeLetterIcon(letter, bg) {
    return L.divIcon({
        className: '',
        html: `<div style="background:${bg};color:white;border-radius:50%;width:30px;height:30px;
                     display:flex;align-items:center;justify-content:center;
                     font-size:13px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid white;">${letter}</div>`,
        iconSize: [30, 30], iconAnchor: [15, 15],
    });
}
function makePOIIcon(emoji, bg) {
    return L.divIcon({
        className: '',
        html: `<div style="background:${bg};color:white;border-radius:8px;width:30px;height:30px;
                     display:flex;align-items:center;justify-content:center;
                     font-size:14px;box-shadow:0 2px 6px rgba(0,0,0,0.28);border:1.5px solid white;">${emoji}</div>`,
        iconSize: [30, 30], iconAnchor: [15, 30],
    });
}

/* ── Geocode a city/place name using Nominatim ──────────────────────── */
async function geocode(place) {
    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place + ', India')}&limit=1&countrycodes=in`;
    try {
        const r = await fetch(url, { headers: { 'Accept-Language': 'en', 'User-Agent': 'LogiControl/1.0' } });
        const data = await r.json();
        if (data && data[0]) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
    } catch (e) {}
    return null;
}

/* ── Get a point along the route at a given fraction (0–1) ──────────── */
function pointAlongRoute(coords, fraction) {
    if (!coords || coords.length < 2) return null;
    let totalLen = 0;
    for (let i = 1; i < coords.length; i++) {
        totalLen += map.distance(L.latLng(coords[i-1]), L.latLng(coords[i]));
    }
    const target = totalLen * Math.max(0, Math.min(1, fraction));
    let traveled = 0;
    for (let i = 1; i < coords.length; i++) {
        const seg = map.distance(L.latLng(coords[i-1]), L.latLng(coords[i]));
        if (traveled + seg >= target) {
            const t = (target - traveled) / seg;
            return [
                coords[i-1][0] + t * (coords[i][0] - coords[i-1][0]),
                coords[i-1][1] + t * (coords[i][1] - coords[i-1][1]),
            ];
        }
        traveled += seg;
    }
    return coords[coords.length - 1];
}

/* ── Main map init ───────────────────────────────────────────────────── */
document.addEventListener('DOMContentLoaded', async function () {
    // Init with a temporary centre; will fit bounds after route loads
    map = L.map('gmap', { zoomControl: true }).setView([20.5937, 78.9629], 6);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        maxZoom: 18,
    }).addTo(map);

    poiLayerGroup = L.layerGroup().addTo(map);

    // Geocode both endpoints in parallel
    const [startCoords, endCoords] = await Promise.all([
        geocode(MD.start),
        geocode(MD.end),
    ]);

    // ── A marker (start) ────────────────────────────────────────────────
    if (startCoords) {
        L.marker(startCoords, { icon: makeLetterIcon('A', '#22c55e') })
         .addTo(map)
         .bindPopup(`<strong>🚀 Origin</strong><br>${MD.start}`);
    }

    // ── B marker (destination) ───────────────────────────────────────────
    if (endCoords) {
        L.marker(endCoords, { icon: makeLetterIcon('B', '#ef4444') })
         .addTo(map)
         .bindPopup(`<strong>🏁 Destination</strong><br>${MD.end}`);
    }

    // ── OSRM route A → B ────────────────────────────────────────────────
    if (startCoords && endCoords) {
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/` +
            `${startCoords[1]},${startCoords[0]};${endCoords[1]},${endCoords[0]}` +
            `?overview=full&geometries=geojson`;
        try {
            const r = await fetch(osrmUrl);
            const data = await r.json();
            if (data.routes && data.routes[0]) {
                routeCoords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);

                // Draw the route line
                L.polyline(routeCoords, {
                    color: '#0b4a99', weight: 5, opacity: 0.85,
                    dashArray: null,
                }).addTo(map);

                // Fit map to the full route
                map.fitBounds(L.latLngBounds(routeCoords), { padding: [50, 50] });

                // ── Vehicle marker (placed along route by progress %) ──────
                const pct = (MD.pct || 0) / 100;
                let truckPos;
                if (MD.has_gps) {
                    truckPos = [MD.lat, MD.lng];           // real GPS
                } else {
                    truckPos = pointAlongRoute(routeCoords, pct) || startCoords;
                }

                vehicleMarker = L.marker(truckPos, { icon: makeCircleIcon('🚛', '#0b4a99') })
                    .addTo(map)
                    .bindPopup(`<strong>${MD.reg}</strong><br>${MD.start} → ${MD.end}<br>Speed: ${MD.speed} km/h`);
            }
        } catch (e) {
            // Fallback: just zoom to start
            if (startCoords) map.setView(startCoords, 9);
        }
    } else if (startCoords) {
        map.setView(startCoords, 9);
    }
});

/* ── Overpass API: query POIs along the route bounding box ──────────── */
const POI_CONFIG = {
    fuel:    { query: 'amenity=fuel',              emoji: '⛽', color: '#f59e0b', label: 'Fuel Station' },
    food:    { query: 'amenity=restaurant',        emoji: '🍽', color: '#10b981', label: 'Restaurant' },
    service: { query: 'shop=car_repair',           emoji: '🔧', color: '#6366f1', label: 'Service Center' },
};

function setButtonLoading(btn, loading) {
    if (loading) {
        btn.dataset.origHtml = btn.innerHTML;
        btn.innerHTML = btn.innerHTML.replace(/(<i[^>]*><\/i>\s*)/, '$1<span class="spinner-border spinner-border-sm ms-1" role="status"></span> ');
        btn.disabled = true;
    } else {
        if (btn.dataset.origHtml) btn.innerHTML = btn.dataset.origHtml;
        btn.disabled = false;
    }
}

async function searchNearby(type) {
    const cfg = POI_CONFIG[type];
    if (!cfg || !map) return;

    const btn = document.getElementById(type + 'Btn');

    // Toggle off if same type is active
    if (activePoiType === type) {
        poiLayerGroup.clearLayers();
        activePoiType = null;
        document.querySelectorAll('.wp-btn').forEach(b => b.classList.remove('active-poi'));
        return;
    }

    // Clear existing POI markers
    poiLayerGroup.clearLayers();
    activePoiType = type;
    document.querySelectorAll('.wp-btn').forEach(b => b.classList.remove('active-poi'));
    if (btn) { btn.classList.add('active-poi'); setButtonLoading(btn, true); }

    // Build bounding box from map's current view
    const bounds = map.getBounds();
    const s = bounds.getSouth().toFixed(4), w = bounds.getWest().toFixed(4);
    const n = bounds.getNorth().toFixed(4), e = bounds.getEast().toFixed(4);

    const overpassQuery = `[out:json][timeout:10];node[${cfg.query}](${s},${w},${n},${e});out 30;`;
    const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(overpassQuery)}`;

    try {
        const r = await fetch(url);
        const data = await r.json();

        if (!data.elements || data.elements.length === 0) {
            showMapToast(`No ${cfg.label}s found in the current map area.`, 'warning');
            if (btn) setButtonLoading(btn, false);
            activePoiType = null;
            return;
        }

        let count = 0;
        data.elements.forEach(node => {
            if (!node.lat || !node.lon) return;
            const name = node.tags?.name || cfg.label;
            const brand = node.tags?.brand ? ` (${node.tags.brand})` : '';
            L.marker([node.lat, node.lon], { icon: makePOIIcon(cfg.emoji, cfg.color) })
             .addTo(poiLayerGroup)
             .bindPopup(`<strong>${cfg.emoji} ${name}${brand}</strong><br><small style="color:#64748b;">${cfg.label}</small>`);
            count++;
        });

        showMapToast(`Found ${count} ${cfg.label}${count !== 1 ? 's' : ''} on the map.`, 'success');
    } catch (e) {
        showMapToast(`Could not load ${cfg.label}s. Please try again.`, 'error');
        activePoiType = null;
    }

    if (btn) setButtonLoading(btn, false);
}

/* ── Toast notification inside the map ──────────────────────────────── */
function showMapToast(msg, type) {
    const colors = { success: '#22c55e', warning: '#f59e0b', error: '#ef4444' };
    const toast = document.createElement('div');
    toast.style.cssText = `position:absolute;bottom:5.5rem;left:50%;transform:translateX(-50%);
        background:${colors[type]||'#1e293b'};color:white;padding:0.6rem 1.2rem;border-radius:50px;
        font-size:0.8rem;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,0.2);z-index:9999;white-space:nowrap;`;
    toast.textContent = msg;
    document.querySelector('.map-wrap').appendChild(toast);
    setTimeout(() => toast.remove(), 3500);
}

function shareTracking() {
    const link = window.location.href;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(link).then(() => showMapToast('Tracking link copied!', 'success'));
    } else {
        prompt('Copy this tracking link:', link);
    }
}
</script>
{% endif %}
