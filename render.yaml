services:
  - type: web
    name: logicontrol
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn logistics_fleet.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: DATABASE_URL
        sync: false # User needs to paste the Railway/TiDB connection string here in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
